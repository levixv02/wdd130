<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact US</title>
    <meta name="description" content="This page shows all methods you can do to contact us">
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="author" content="Lévi Tshipamba">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="logo of our website">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="infos">
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 999</p>
            <p>info@whitewater.com</p>
        </section>
    
        <section class="card">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1584744.5378146872!2d-106.7996249931584!3d39.12458505801918!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x876ba3032bcccacd%3A0xd26f6b478464bd6c!2sRiver%20Rush%20Rafting%20-%20Clear%20Creek%20Whitewater!5e0!3m2!1sen!2sus!4v1790928734391!5m2!1sen!2sus" width="100%" height="100%" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form action="#">
                <div>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Enter your full name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Entre your email adress" required>
                </div>
                
                <div class="purposeMessage">
                    <p>Message<br>Purpose</p>
                    <div class="message">
                        <div>
                            <input type="radio" name="general" id="purpose" value="general">
                            <label for="general">General Inquiry</label>
                        </div>

                        <div>
                            <input type="radio" name="question" id="purpose" value="question">
                            <label for="question">Reservation Question</label>
                        </div>

                        <div>
                            <input type="radio" name="suggestion" id="purpose" value="suggestion">
                            <label for="suggestion">Web Suggestion</label>
                        </div>
                    </div>
                </div>

                <div class="message">
                    <p>Message</p>
                    <div>
                        <textarea name="message" id="message" placeholder="Write your message here..." rows="7" cols="40" required></textarea>
                        <div class="checkbox">
                            <input type="checkbox" name="check" id="check">
                            <p>Please subscribe me to the monthly newsletter</p>
                        </div>
                        <button type="submit" class="btn">Get in Touch!</button>
                    </div>
                </div>
            </form>
        </section>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="ourteam">
                <figure>
                    <img src="images/lead.jpg" alt="image of Jordan Smith, Lead River Guide">
                    <figcaption>
                        <h4>Jordan Smith</h4>
                        <p>Lead River Guide</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/manager.jpg" alt="image of Sana Renol, Reservation Manager">
                    <figcaption>
                        <h4>Sana Renol</h4>
                        <p>Reservation Manager</p>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/instructor.jpg" alt=" Pic of Michael Brown, Safety Instructor">
                    <figcaption>
                        <h4>Michael Brown</h4>
                        <p>Safety Instructor</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 😍 Lévi Tshipamba😍 Lubumbashi, R.D.Congo </p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.svg" alt="facebook icon"></a>
            <a href="#"><img src="images/instagram.svg" alt="instaram icon"></a>
            <a href="#"><img src="images/linkedin.svg" alt="linkedin icon"></a>
        </nav>
    </footer>
</body>
</html>
